<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>بطاقات QR · CodeHer</title>
  <!-- صفحة A4 فيها ٨ بطاقات (كل وحدة ١٠٠×٧٢ مم) مع هامش ٥ مم للطابعة. اطبعوها بدون هوامش إضافية، وقصّوا على الخطوط المنقّطة. -->
  <style>
    @font-face { font-family: "Plex"; font-weight: 400; src: url("../fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFC, U+200C-200E; }
    @font-face { font-family: "Plex"; font-weight: 400; src: url("../fonts/ibm-plex-sans-arabic-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
    @font-face { font-family: "Plex"; font-weight: 500; src: url("../fonts/ibm-plex-sans-arabic-arabic-500-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFC, U+200C-200E; }
    @font-face { font-family: "Plex"; font-weight: 700; src: url("../fonts/ibm-plex-sans-arabic-arabic-700-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFC, U+200C-200E; }
    @font-face { font-family: "Plex"; font-weight: 700; src: url("../fonts/ibm-plex-sans-arabic-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }

    :root { --pink: #FF0092; --pink-dark: #D1007A; --tint: #FCE1EE; --soft: #FFF3F8; --navy: #0A1D2C; --muted: #5F6673; }
    @page { size: A4; margin: 0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #fff; }
    body { font-family: "Plex", Tahoma, "Segoe UI", sans-serif; color: var(--navy); -webkit-print-color-adjust: exact; print-color-adjust: exact; }

    .sheet {
      width: 210mm; height: 296.8mm;
      overflow: hidden;
      padding: 5mm;
      display: grid;
      grid-template-columns: 100mm 100mm;
      grid-template-rows: repeat(4, 71.6mm);
      align-content: center;
      justify-content: center;
      page-break-after: always;
    }
    .sheet:last-child { page-break-after: auto; }

    .card {
      position: relative;
      height: 71.6mm;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 39mm;     /* RTL: النص يمين، الـ QR يسار */
      align-items: center;
      gap: 3mm;
      padding: 5mm 5.5mm 4mm 4.5mm;
      border: 0.15mm dashed #B8C0CC;
    }

    /* شريط زهري ناعم بالجنب */
    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 0 auto;
      width: 2.4mm;
      background: linear-gradient(180deg, var(--pink), #FF5CB4);
    }

    .text { display: flex; flex-direction: column; align-items: flex-start; text-align: start; min-width: 0; }
    .logo { height: 7.5mm; width: auto; aspect-ratio: 2.6 / 1; object-fit: cover; object-position: center; mix-blend-mode: multiply; margin-inline-start: -1.2mm; }
    .date { margin-top: 0.6mm; font-size: 2.3mm; font-weight: 500; color: var(--muted); white-space: nowrap; }
    .title { margin: 1.2mm 0 0; font-size: 4.3mm; font-weight: 700; line-height: 1.3; white-space: nowrap; }
    .title span { color: var(--pink); }
    .wave { width: 50mm; height: 4mm; margin: 0.8mm 0 1.2mm; }
    .cta { margin: 0; font-size: 2.95mm; font-weight: 700; line-height: 1.5; }
    .cta b { color: var(--pink-dark); }
    .tips {
      margin: 1.6mm 0 0; padding: 0; list-style: none;
      display: grid; grid-template-columns: auto auto; gap: 1mm 1.2mm;
    }
    .tips li {
      padding: 0.4mm 1.8mm;
      border-radius: 99mm;
      background: var(--soft);
      border: 0.25mm solid var(--tint);
      font-size: 2.25mm;
      font-weight: 700;
      white-space: nowrap;
    }
    .tips li::before { content: attr(data-n) " "; color: var(--pink-dark); }

    .side { display: flex; flex-direction: column; align-items: center; gap: 1.6mm; }
    .qrbox {
      padding: 2mm;
      border-radius: 3.5mm;
      background: #fff;
      border: 0.5mm solid var(--tint);
      box-shadow: 0 1mm 3mm -1.5mm rgba(255, 0, 146, .35);
    }
    .qrbox img { display: block; width: 33mm; height: 33mm; image-rendering: pixelated; }
    .scan { font-size: 2.4mm; font-weight: 700; color: var(--pink-dark); }
    .url { font-size: 1.9mm; color: var(--muted); direction: ltr; text-align: center; line-height: 1.3; }
  </style>
</head>
<body>
  <template id="card">
    <article class="card">
      <div class="text">
        <img class="logo" src="../assets/codeher-logo.png" alt="CodeHer">
        <div class="date">٢٢ أكتوبر — اليوم العالمي للتوعية بالتأتأة</div>
        <h1 class="title"><span>خـ.. خـ..</span> خلّيني أكمّل كلامي</h1>
        <svg class="wave" viewBox="0 0 300 24" aria-hidden="true">
          <path d="M0 12 C30 2, 55 22, 85 12 S135 3, 160 12 l4 -6 l4 12 l4 -12 l4 12 l4 -6 C200 21, 230 3, 260 12 S290 18, 300 12"
                fill="none" stroke="#FF0092" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <p class="cta">صوّر الكود وخذ معك<br><b>أربع أشياء بتفرق</b> لما تحكي مع شخص بيتأتئ</p>
        <ul class="tips">
          <li data-n="١">استنى</li>
          <li data-n="٢">ما تكمّل عنه</li>
          <li data-n="٣">ضل متطلع فيه</li>
          <li data-n="٤">اسمع الشو مش الكيف</li>
        </ul>
      </div>
      <div class="side">
        <div class="qrbox"><img src="../assets/tips-qr.png" alt="QR"></div>
        <div class="scan">صوّرني</div>
        <div class="url">codeher-stutter-booth<br>.netlify.app/tips</div>
      </div>
    </article>
  </template>

  <main id="sheets"></main>

  <script>
    // عدد الصفحات (كل صفحة ٨ بطاقات): ?pages=3
    const pages = Math.max(1, Math.min(20, parseInt(new URLSearchParams(location.search).get('pages')) || 1));
    const tpl = document.getElementById('card');
    for (let p = 0; p < pages; p++) {
      const sheet = document.createElement('section');
      sheet.className = 'sheet';
      for (let i = 0; i < 8; i++) sheet.appendChild(tpl.content.cloneNode(true));
      document.getElementById('sheets').appendChild(sheet);
    }
  </script>
</body>
</html>
